
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>DOM Practice Lab</title>
</head>
<body>

    <h1 id="title">Welcome to DOM Practice!</h1>

    <!-- Exercise 1: Change Color -->
    <button id="colorButton">Change Color</button>

    <hr>

    <!-- Exercise 2: Live Text -->
    <h2>Live Text Practice</h2>
    <input id="textInput" type="text" placeholder="Type something...">
    <p id="outputText">Your text will appear here.</p>

    <hr>

    <!-- Exercise 3: Form Validation -->
    <h2>Email Validation</h2>
    <form id="emailForm">
        <input id="emailInput" type="text" placeholder="Enter your email">
        <button type="submit">Submit Email</button>
    </form>
    <p id="errorText"></p>

    <script src="script.js"></script>
</body>
</html>
